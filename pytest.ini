[pytest]
# Только тесты скрапера; у dwh_demo свой pytest.ini (запускается отдельно).
# Раскладка tests/ зеркалит слои пакета:
#   tests/backend/domain          — VO, классификация, парсинг (чистая логика)
#   tests/backend/application     — отбор кандидатов, чаты, аналитика, фасады
#   tests/backend/infrastructure  — источники, сеть, хранилище
#   tests/backend/presentation    — санитайзер описаний
#   tests/backend/*.py            — оркестрация уровня hh.py (санити-гейт сбора)
#   tests/feed/                   — фронт, гоняется node:test (npm test), НЕ pytest
# testpaths сужен до backend: иначе pytest пытается собирать tests/feed/*.js.
testpaths = tests/backend

# -ra              — сводка по non-pass в конце (skip/xfail видны, а не теряются)
# --strict-markers — незарегистрированный маркер = ошибка, а не молчаливый пропуск
# --strict-config  — опечатка в этом файле = ошибка, а не тихий игнор
addopts = -ra --strict-markers --strict-config

# xfail, который внезапно прошёл, — это провал: баг починен, метку пора снять.
xfail_strict = true

markers =
    slow: медленные/сетевые opt-in тесты — полный кеш вакансий (PRESCREEN_FULL) или
        реальный OpenRouter (INTENT_LIVE). Вне обычного прогона.
