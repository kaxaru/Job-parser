; Статическая проверка типов. Запуск: ..\.venv3\Scripts\python.exe -m mypy
; Область — пакет приложения (hrwork) + CLI. dwh_demo НЕ входит: это отдельный стек
; со своими ruff.toml/pytest.ini и своими зависимостями (Airflow/ETL).
[mypy]
python_version = 3.10
files = hrwork, hh.py
strict = True
; Анализируем КАК НА WINDOWS, независимо от того, где запущен mypy. Проект Windows-only по
; эксплуатации (Task Scheduler, taskkill, пути .exe — см. CLAUDE.md), и `lock.py::_pid_alive`
; зовёт `ctypes.windll` — атрибут, которого в стабах для Linux нет вовсе.
; Без этой строки CI на ubuntu падал тремя `Module has no attribute "windll"`, хотя локально
; на Windows проверка была зелёной (07.08.2026). Расхождение результата между машиной
; разработчика и CI хуже самой ошибки: чинишь то, чего у себя не видишь.
; Рантайм от этого не меняется — у `_pid_alive` есть не-Windows фолбэк через `os.kill`.
platform = win32
; Пути к чужим пакетам без стабов (playwright, plotly, jinja2 и пр.) — не наша забота:
; их отсутствие не должно топить отчёт по своему коду.
ignore_missing_imports = True
show_error_codes = True
pretty = True
exclude = (^|/)(\.venv|\.venv3|dwh_demo|logs|data)/
