# Pre-commit: те же проверки, что в CI (.github/workflows/ci.yml), только до пуша.
#
# Установка (один раз на клон):
#   pip install pre-commit           # или: ..\.venv3\Scripts\python.exe -m pip install pre-commit
#   pre-commit install
#
# Разовый пропуск:            git commit --no-verify
# Пропустить один хук:        SKIP=pytest git commit ...
# Прогнать по всему репо:     pre-commit run --all-files
#
# language: system — тулы берутся из АКТИВНОГО окружения, а не из отдельных venv'ов
# фреймворка. Это осознанно: mypy и pytest требуют всех зависимостей проекта, ставить их
# второй раз ради хука — дольше и разъезжается с тем, что реально гоняет CI.
# Значит, коммитить надо из активированного .venv3 (см. CLAUDE.md).
#
# pass_filenames: false — все три инструмента конфигурируются файлами в корне
# (ruff.toml / mypy.ini / pytest.ini) и знают свою область сами. Передача им списка
# изменённых файлов сузила бы проверку до него: mypy на одном файле не увидит поломку
# в его вызывающих, а pytest прогнал бы не те тесты.
# ВЫЗОВ ЧЕРЕЗ `python -m`, а не голым именем: в .venv3 нет `pytest.exe` (есть только
# ruff.exe/mypy.exe) — ровно тот же класс поломки, что и описанный в CLAUDE.md сломанный
# pip.exe. Голое `pytest` уходило в системный Python 3.14 и падало 37 ошибками сборки
# «No module named dotenv», что читается как поломка тестов, а не как не тот интерпретатор.
repos:
  - repo: local
    hooks:
      # Гейт окружения. Идёт ПЕРВЫМ и стоит миллисекунды: без него неверный интерпретатор
      # проявляется грудой ImportError, в которых причина не видна.
      - id: venv-guard
        name: venv .venv3 активирован
        entry: python tools/check_venv.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check --fix
        entry: python -m ruff check . --fix
        language: system
        pass_filenames: false
        types_or: [python]

      # ruff format ВЫКЛЮЧЕН СОЗНАТЕЛЬНО. Замер 07.08.2026: переформатировал бы 103 файла
      # из 115. Код здесь выровнен вручную — параметры `build_vacancy` в столбик по `=`,
      # комментарии по колонкам, вилки регексов разбиты по смыслу; форматтер это снесёт,
      # и diff в сотню файлов похоронит историю правок. Включать — только отдельным
      # коммитом «форматирование», ничего больше в нём не меняя.
      # - id: ruff-format
      #   name: ruff format
      #   entry: python -m ruff format .
      #   language: system
      #   pass_filenames: false
      #   types_or: [python]

      - id: mypy
        name: mypy strict
        entry: python -m mypy --config-file mypy.ini
        language: system
        pass_filenames: false
        types_or: [python]

      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        types_or: [python]

      # JS-часть CI: джобы js-unit и biome. Гоняются только когда менялись .js —
      # types_or тут работает как фильтр, хотя сами команды берут область из конфигов.
      - id: npm-test
        name: npm test (node:test)
        entry: npm test --silent
        language: system
        pass_filenames: false
        types_or: [javascript]

      - id: biome
        name: biome lint src
        entry: biome lint src
        language: system
        pass_filenames: false
        types_or: [javascript]
