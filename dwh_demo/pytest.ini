[pytest]
testpaths = tests
# -m "not integration": голый `pytest` НЕ должен трогать БД. Интеграционные тесты делают
# TRUNCATE базы `hh` — на поднятом стеке рефлекторный прогон стирал бы демо-данные.
# Запускать осознанно: `pytest -m integration` (аргумент CLI перекрывает addopts).
addopts = --strict-markers -ra -m "not integration"
markers =
    unit: быстрые тесты без внешних зависимостей (домен, оркестрация на фейках)
    integration: требуют живых Postgres/ClickHouse (CI service containers)
