[pytest]
testpaths = tests
# -m "not integration": голый `pytest` НЕ должен трогать БД. Интеграционные тесты делают
# TRUNCATE базы `hh` — на поднятом стеке рефлекторный прогон стирал бы демо-данные.
# Запускать осознанно: `pytest -m integration` (аргумент CLI перекрывает addopts).
# --strict-config: опечатка в самом этом файле — ошибка, а не молча проигнорированный ключ
# (защита ровно для строки выше: `addopts` с опечаткой снял бы фильтр интеграционных).
addopts = --strict-markers --strict-config -ra -m "not integration"
# xfail_strict: чинившийся xfail обязан стать красным, иначе набор годами носит
# «ожидаемое падение», которого давно нет.
xfail_strict = true
markers =
    unit: быстрые тесты без внешних зависимостей (домен, оркестрация на фейках)
    integration: требуют живых Postgres/ClickHouse (CI service containers)
    real_fx: тест проверяет САМ загрузчик курсов — не подменять его синтетикой (conftest)
