# Прод-образец конфига Loki: объектное хранилище (S3/MinIO) + retention + лимиты.
# Контраст с дефолтом образа (монолит на локальном диске, без ретеншена/лимитов).

auth_enabled: false                  # один tenant; в multi-tenant -> true (+ X-Scope-OrgID)

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki                 # локально: индекс-кэш, compactor, wal
  replication_factor: 1              # demo: 1; в проде 3 (HA, переживает падение ноды)
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:                              # ВСЕ компоненты складывают чанки/индекс сюда
      endpoint: minio:9000           # имя сервиса в сети compose
      bucketnames: loki
      access_key_id: minioadmin
      secret_access_key: minioadmin
      s3forcepathstyle: true         # MinIO требует path-style (bucket в пути, не в хосте)
      insecure: true                 # http (локальный MinIO без TLS); в проде false + https

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb                    # современный индекс (вместо устаревшего boltdb-shipper)
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h             # 30 дней — дальше compactor удалит
  ingestion_rate_mb: 10              # защита от шумного источника (МБ/с на tenant)
  ingestion_burst_size_mb: 20
  max_streams_per_user: 10000
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 7 дней — ровно это давало нам "too old"
  max_query_length: 721h
  max_query_parallelism: 16
  volume_enabled: true               # включает /loki/api/v1/volume (объём логов)

compactor:
  working_directory: /loki/compactor
  retention_enabled: true            # БЕЗ этого retention_period не применяется
  delete_request_store: s3
  compaction_interval: 10m

ingester:
  chunk_idle_period: 30m             # сбросить чанк, если поток молчит 30 мин
  max_chunk_age: 1h                  # и не держать чанк дольше часа
  chunk_target_size: 1572864         # ~1.5 МБ целевой размер чанка

querier:
  max_concurrent: 8

query_range:
  align_queries_with_step: true
  cache_results: true                # кэш результатов запросов (ускоряет повторные)
