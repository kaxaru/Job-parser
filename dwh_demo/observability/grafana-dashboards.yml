# Провайдер дашбордов: Grafana подхватывает все *.json из указанной папки.
apiVersion: 1

providers:
  - name: hh-dwh
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
