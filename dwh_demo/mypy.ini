; Статическая проверка типов ПОДПРОЕКТА. Запуск из dwh_demo/:
;   ..\..\.venv3\Scripts\python.exe -m mypy
;
; Заведён 09.08.2026. До этого у подпроекта конфига не было вовсе: родитель держит
; `strict = True` правилом и хуком pre-commit, а стенд не проверялся ничем — асимметрия,
; которую аудит того же дня отметил отдельно. Разные стандарты в одном репозитории
; означают, что «у нас mypy strict» перестаёт быть правдой, а половинчатое утверждение
; хуже отсутствующего.
[mypy]
python_version = 3.10
; Только продуктовые пакеты. `tests/` не входит — так же, как у родителя: тест вправе
; собирать неаннотированные фикстуры, и strict там даёт шум без пользы.
files = etl, bi, dags
strict = True

; Платформа НЕ фиксируется, в отличие от родителя (там `platform = win32` из-за
; `ctypes.windll` в `lock.py::_pid_alive`). Стенд платформо-зависимого кода не содержит
; и исполняется НА ДВУХ платформах сразу: с машины владельца — Windows, в контейнерах
; Airflow — Linux. Прибить анализ к одной из них значило бы проверять не тот код,
; который поедет в прод.

; Чужие пакеты без стабов — psycopg2, pymssql, requests, airflow. Отдельно про airflow:
; его нет и в `requirements-dev.txt` (DAG исполняется только внутри контейнера), поэтому
; `dags/` без этой строки не прошёл бы даже импорт. Отсутствие стабов у чужой библиотеки
; не должно топить отчёт по СВОЕМУ коду.
ignore_missing_imports = True

show_error_codes = True
pretty = True

; ── Ловушка кодировки, стоившая получаса ──────────────────────────────────────
; mypy читает этот файл кодировкой локали (configparser), а на машине разработки она
; cp1251. Файл в UTF-8, и почти любой русский текст переживает такое чтение мусором —
; комментарии mypy не нужны. Кроме одного байта: 0x98 в cp1251 НЕ ОПРЕДЕЛЁН, а именно
; он стоит вторым в UTF-8 у заглавной русской «и» (D0 98). Одна такая буква в комментарии
; роняет mypy с UnicodeDecodeError ещё до разбора конфига — и падение выглядит как
; поломка самого mypy, а не как опечатка в тексте.
; Поэтому заглавной «и» здесь нет, а страж
; `tests/test_config_files.py::test_mypy_config_survives_a_cp1251_locale` не даёт ей
; вернуться. У родителя того же байта нет случайно, а не по правилу.
